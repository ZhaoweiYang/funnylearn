<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="description" content="点一下，唤起 iPhone 的「添加到钱包」。" />
    <title>添加到钱包</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%9B%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #f2f2f7;
        --card: #ffffff;
        --ink: #1c1c1e;
        --sub: #8e8e93;
        --line: #e5e5ea;
        --blue: #0a84ff;
        --blue-press: #0060df;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "PingFang SC", "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 20px
          max(24px, env(safe-area-inset-bottom));
      }

      .wrap {
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .hero {
        text-align: center;
        margin-top: 8vh;
      }
      .glyph {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        font-size: 46px;
        background: linear-gradient(160deg, #ffffff, #e9e9ef);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }
      .lede {
        font-size: 16px;
        line-height: 1.5;
        color: var(--sub);
        margin: 0 auto;
        max-width: 22em;
      }

      .spacer {
        flex: 1;
        min-height: 28px;
      }

      .cta {
        appearance: none;
        border: 0;
        width: 100%;
        padding: 17px 20px;
        border-radius: 16px;
        background: var(--blue);
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: transform 0.08s ease, background 0.15s ease;
        box-shadow: 0 8px 22px rgba(10, 132, 255, 0.32);
      }
      .cta:active {
        transform: scale(0.975);
        background: var(--blue-press);
      }
      .cta svg {
        width: 22px;
        height: 22px;
      }

      .note {
        margin-top: 16px;
        font-size: 13px;
        line-height: 1.55;
        color: var(--sub);
        text-align: center;
        min-height: 1.55em;
      }
      .note a {
        color: var(--blue);
        text-decoration: none;
      }

      /* 状态条 */
      .status {
        margin-top: 14px;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        padding: 0 16px;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
        font-size: 14px;
        line-height: 1.5;
      }
      .status.show {
        max-height: 240px;
        opacity: 1;
        padding: 14px 16px;
      }
      .status .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .status .dot {
        flex: 0 0 auto;
        font-size: 16px;
        line-height: 1.4;
      }
      .status b {
        font-weight: 600;
      }
      .status small {
        display: block;
        color: var(--sub);
        margin-top: 3px;
        font-size: 12.5px;
      }

      .foot {
        text-align: center;
        color: var(--sub);
        font-size: 12px;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <div class="glyph" aria-hidden="true">👛</div>
        <h1>添加到「钱包」</h1>
        <p class="lede">点下面的按钮，唤起 iPhone 的钱包 App，把卡片、钥匙和凭证收纳到一处。</p>
      </div>

      <div class="spacer"></div>

      <button class="cta" id="addBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7.5Z"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path d="M14.5 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        添加卡到钱包
      </button>

      <div class="note" id="note"></div>

      <div class="status" id="status" role="status" aria-live="polite"></div>

      <div class="foot">本页面尝试唤起系统「钱包」App · 仅在 iPhone / iPad 上可用</div>
    </div>

    <script>
      (function () {
        var btn = document.getElementById("addBtn");
        var note = document.getElementById("note");
        var status = document.getElementById("status");

        // 苹果钱包没有公开的“直达添加卡片选择页”的链接，
        // 这里依次尝试已知的钱包 URL scheme：shoebox://（钱包旧称 Passbook 的内部名）→ wallet://
        var SCHEMES = ["shoebox://", "wallet://"];

        var isIOS =
          /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        function setStatus(html) {
          status.innerHTML = html;
          status.classList.add("show");
        }

        if (!isIOS) {
          note.innerHTML = "「钱包」是 iPhone / iPad 上的系统应用，请在苹果设备上打开本页面。";
        } else {
          note.innerHTML = "点按后将尝试打开系统「钱包」。在弹出的钱包里点“＋”即可添加卡片。";
        }

        function tryOpen() {
          if (!isIOS) {
            setStatus(
              '<div class="row"><span class="dot">⚠️</span><div><b>当前设备不是 iPhone / iPad</b>' +
                "<small>系统「钱包」只在苹果设备上存在，无法唤起。请用 iPhone 扫码或打开此链接再试。</small></div></div>"
            );
            return;
          }

          var left = false;
          function markLeft() {
            left = true;
          }
          // 一旦页面被切走（钱包被拉起），说明成功
          document.addEventListener("visibilitychange", function () {
            if (document.hidden) markLeft();
          });
          window.addEventListener("pagehide", markLeft);
          window.addEventListener("blur", markLeft);

          setStatus(
            '<div class="row"><span class="dot">⏳</span><div><b>正在唤起「钱包」…</b>' +
              "<small>若弹出确认框，请选择「打开」。</small></div></div>"
          );

          // 依次尝试各 scheme
          var i = 0;
          function attempt() {
            if (left || i >= SCHEMES.length) {
              if (!left) fail();
              return;
            }
            window.location.href = SCHEMES[i++];
            setTimeout(attempt, 1200);
          }
          attempt();

          function fail() {
            setStatus(
              '<div class="row"><span class="dot">ℹ️</span><div><b>没能自动打开「钱包」</b>' +
                "<small>iOS 没有公开“直达添加卡片页”的链接，系统可能拦截了跳转。" +
                "请手动从主屏幕打开「钱包」App，点右上角「＋」来添加卡片。</small></div></div>"
            );
          }
        }

        btn.addEventListener("click", tryOpen);
      })();
    </script>
  </body>
</html>
